<div class="editar-container">
  <div class="editar-card">

    <div class="editar-header">
      <h1>Editar usuario</h1>
      <p>Actualiza la información del usuario</p>
    </div>

    <div class="mensaje-error" *ngIf="errorMensaje" role="alert">
      ⚠️ {{ errorMensaje }}
    </div>

    <div class="mensaje-exito" *ngIf="exitoMensaje" role="status" aria-live="polite">
      ✅ {{ exitoMensaje }}
    </div>

    <div class="cargando" *ngIf="cargando">
      Cargando información del usuario...
    </div>

    <form (ngSubmit)="guardarCambios()" #editarForm="ngForm" *ngIf="!cargando && !errorMensaje">

      <div class="campo-form">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre"
          required
        />
      </div>

      <div class="campo-form">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="campo-form">
        <label for="rol">Rol</label>
        <select id="rol" name="rol" [(ngModel)]="rol" required [disabled]="guardando">
          <option value="usuario">Usuario</option>
          <option value="admin">Admin</option>
        </select>
        <p class="ayuda-rol">Admin concede acceso al panel de administración; Usuario mantiene permisos normales.</p>
      </div>

      <div class="botones-form">
        <button type="button" class="btn-cancelar" (click)="cancelar()">
          Cancelar
        </button>
        <button
          type="submit"
          class="btn-guardar"
          [disabled]="guardando || editarForm.invalid"
          [attr.aria-label]="guardando ? 'Guardando cambios' : 'Guardar cambios'">
          {{ guardando ? 'Guardando cambios...' : 'Guardar cambios' }}
        </button>
      </div>

    </form>

  </div>
</div>
