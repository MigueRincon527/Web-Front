<div class="nav">
    <div class="container">

            <h1><a routerLink="home">RICH-<span>POWER</span></a></h1>
        </div>
        <div class="menu">
            <ul>
                <li class="store-menu">
                    <button type="button" class="store-menu-trigger" aria-controls="store-submenu"
                        [attr.aria-expanded]="isStoreMenuOpen" (click)="toggleStoreMenu()">

                    <ul class="submenu" id="store-submenu">
                        <li><a routerLink="proteinas" (click)="closeStoreMenu()">Proteinas</a></li>

                        <li><a routerLink="vitaminas" (click)="closeStoreMenu()">Vitaminas</a></li>
                    </ul>
                    }
                </li>
                @if (auth.isAdmin()) {
                <li class="btn"><a routerLink="dashboard">Dashboard</a></li>
                }
                <li><a routerLink="login">Ingresar</a></li>
                <li class="btn"><a routerLink="register">Registrarse</a></li>
            </ul>

            @if (carrito.unidades() > 0) {
                <span class="header__contador">{{ carrito.unidades() }}</span>
