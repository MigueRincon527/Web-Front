<div class="registro">
  <div class="registro__marca">
    <h1><a routerLink="/home">RICH-<span>POWER</span></a></h1>
  </div>

  <div class="registro__encabezado">
    <p>Bienvenido</p>
    <span>Únete a la élite del fitness</span>
  </div>

  <form class="registro__formulario" (ngSubmit)="registrar()" #registroForm="ngForm" novalidate>
    <div class="registro__campo">
      <label for="nombre">Nombre de usuario</label>
      <input
        id="nombre"
        name="nombre"
        type="text"
        autocomplete="name"
        placeholder="Tu nombre"
        [(ngModel)]="nombre"
        [disabled]="cargando"
        required
      >
    </div>

    <div class="registro__campo">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        [(ngModel)]="email"
        [disabled]="cargando"
        required
      >
    </div>

    <div class="registro__campo">
      <label for="password">Contraseña</label>
      <div class="registro__password">
        <input
          id="password"
          name="password"
          [type]="mostrarPassword ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
          [(ngModel)]="password"
          [disabled]="cargando"
          minlength="6"
          required
        >
        <button
          type="button"
          class="registro__ver-password"
          (click)="togglePassword()"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseñas' : 'Mostrar contraseñas'"
          [disabled]="cargando"
        >
          @if (mostrarPassword) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.9 5.2A11 11 0 0 1 12 5c5 0 9 5 9 7a9.7 9.7 0 0 1-2.1 3.1M6.2 6.2C3.9 7.7 3 10.2 3 12c0 2 4 7 9 7a10 10 0 0 0 4-.8" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12s3.3-7 9-7 9 7 9 7-3.3 7-9 7-9-7-9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (password) {
        <div class="registro__fortaleza" aria-live="polite">
          <div class="registro__fortaleza-barra">
            <span
              [style.width.%]="fortalezaPassword.nivel * 25"
              [style.background-color]="fortalezaPassword.color"
            ></span>
          </div>
          <small [style.color]="fortalezaPassword.color">
            Seguridad: {{ fortalezaPassword.texto }}
          </small>
        </div>
      }
    </div>

    <div class="registro__campo">
      <label for="confirmarPassword">Confirmar contraseña</label>
      <div class="registro__password">
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          [type]="mostrarPassword ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Repite tu contraseña"
          [(ngModel)]="confirmarPassword"
          [disabled]="cargando"
          minlength="6"
          required
        >
        <button
          type="button"
          class="registro__ver-password"
          (click)="togglePassword()"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseñas' : 'Mostrar contraseñas'"
          [disabled]="cargando"
        >
          @if (mostrarPassword) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.9 5.2A11 11 0 0 1 12 5c5 0 9 5 9 7a9.7 9.7 0 0 1-2.1 3.1M6.2 6.2C3.9 7.7 3 10.2 3 12c0 2 4 7 9 7a10 10 0 0 0 4-.8" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12s3.3-7 9-7 9 7 9 7-3.3 7-9 7-9-7-9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    <label class="registro__terminos">
      <input
        type="checkbox"
        name="aceptaTerminos"
        [(ngModel)]="aceptaTerminos"
        [disabled]="cargando"
        required
      >
      <span>Acepto los términos y condiciones</span>
    </label>

    <div class="registro__error" *ngIf="errorMensaje" role="alert">
      {{ errorMensaje }}
    </div>

    <div class="registro__exito" *ngIf="exitoMensaje" role="status">
      {{ exitoMensaje }}
    </div>

    <button type="submit" class="registro__submit" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
    </button>

    <p class="registro__login">
      ¿Ya tienes una cuenta?
      <a routerLink="/login"><span>Inicia sesión</span></a>
    </p>
  </form>
</div>
