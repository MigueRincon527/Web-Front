<div class="login">
  <div class="login__marca">
    <h1><a routerLink="/home">RICH-<span>POWER</span></a></h1>
  </div>

  <div class="login__encabezado">
    <p>Bienvenido</p>
    <span>Inicia sesión en tu cuenta</span>
  </div>

  <form class="login__formulario" (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
    <div class="login__campo">
      <label for="identificador">Correo electrónico</label>
      <input
        id="identificador"
        name="identificador"
        type="text"
        autocomplete="username"
        placeholder="tu@email.com..."
        [(ngModel)]="identificador"
        [disabled]="cargando"
        required
      >
    </div>

    <div class="login__campo">
      <label for="password">Contraseña</label>
      <div class="login__password">
        <input
          id="password"
          name="password"
          [type]="mostrarPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="********"
          [(ngModel)]="password"
          [disabled]="cargando"
          minlength="6"
          required
        >
        <button
          type="button"
          class="login__ver-password"
          (click)="togglePassword()"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [disabled]="cargando"
        >
          @if (mostrarPassword) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
              <path d="M9.9 5.2A11 11 0 0 1 12 5c5 0 9 5 9 7a9.7 9.7 0 0 1-2.1 3.1M6.2 6.2C3.9 7.7 3 10.2 3 12c0 2 4 7 9 7a10 10 0 0 0 4-.8" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12s3.3-7 9-7 9 7 9 7-3.3 7-9 7-9-7-9-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
    </div>

    <label class="login__recordar">
      <input
        type="checkbox"
        name="recordarme"
        [(ngModel)]="recordarme"
        [disabled]="cargando"
      >
      <span>Recordarme</span>
    </label>

    <div class="login__error" *ngIf="errorMensaje" role="alert">
      {{ errorMensaje }}
    </div>

    <button type="submit" class="login__submit" [disabled]="cargando || loginForm.invalid">
      {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>

    <p class="login__registro">
      ¿No tienes una cuenta?
      <a routerLink="/register"><span>Regístrate aquí</span></a>
    </p>
  </form>
</div>
